<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSphere | Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
        .auth-container { max-width: 400px; margin: 100px auto; text-align: center; }
        .auth-form { padding: 30px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        .auth-input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; }
        .auth-btn { width: 100%; padding: 12px; }
        .error-msg { color: #ff4d4d; margin-bottom: 15px; display: none; }
        .success-msg { color: #4CAF50; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>
    <nav class="navbar glass-card">
        <div class="container nav-content">
            <a href="index.html" class="logo"><span class="logo-accent">Cine</span>Sphere</a>
        </div>
    </nav>
    <div class="container auth-container">
        <div style="text-align: left; margin-bottom: 15px;">
            <a href="login.html" style="color: #aaa; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: color 0.3s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#aaa'">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
        <div class="auth-form glass-card">
            <h2>Reset Password</h2>
            <br>
            <p style="font-size:14px; color:#ccc; margin-bottom:20px;">Enter your registered email to receive a password reset link.</p>
            <p style="font-size:14px; color:#ccc; margin-bottom:20px;">Enter your registered email to receive a password reset link.</p>
            <form id="forgotForm">
                <input type="email" id="email" class="auth-input" placeholder="Your Email Address" required>
                <button type="submit" class="btn btn-primary auth-btn" id="submitBtn">Send Reset Link</button>
            </form>
        </div>
    </div>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = document.getElementById('submitBtn');
            
            btn.innerHTML = 'Sending...';
            btn.disabled = true;

            const res = await apiForgotPassword(email);
            
            if(res.error) {
                UI.showToast(res.message, 'error');
                btn.innerHTML = 'Send Reset Link';
                btn.disabled = false;
            } else {
                UI.showToast(res.message || 'Password reset link sent securely to your email inbox!', 'success');
                btn.innerHTML = 'Sent';
            }
        });
    </script>
</body>
</html>
