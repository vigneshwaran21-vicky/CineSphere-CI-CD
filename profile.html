<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | CineSphere</title>
    <!-- CSS Links -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
    <nav class="navbar glass-card">
        <div class="container nav-content">
            <a href="index.html" class="logo"><span class="logo-accent">Cine</span>Sphere</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li id="watchlistLink" style="display:none;"><a href="watchlist.html">Watchlist</a></li>
                <li id="authLink"><a href="login.html">Login</a></li>
            </ul>
        </div>
    </nav>
    <main class="container" style="padding-top: 100px; padding-bottom: 100px;">
        <div class="glass-card pd-2" style="max-width: 600px; margin: 0 auto 50px;">
            <h2 class="section-title">My Profile</h2>
            <div style="font-size: 1.1rem; margin-bottom: 20px;">
                <p style="margin-bottom:10px;"><strong>Name:</strong> <span id="profName" style="color:var(--text-muted);"></span></p>
                <p><strong>Email:</strong> <span id="profEmail" style="color:var(--text-muted);"></span></p>
            </div>
            <button onclick="logout()" class="btn btn-outline" style="width:100%; border-color:#ff4d4d; color:#ff4d4d;">Logout Securely</button>
        </div>

        <h2 class="section-title">My Ratings & Reviews</h2>
        <div class="reviews-container glass-card pd-2" id="myReviewsGrid" style="max-height: 800px;">
            <!-- User reviews loaded here dynamically -->
        </div>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        
        if (!user) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('authLink').innerHTML = `
                <a href="profile.html" class="active" style="color:var(--primary-color)"><i class="fas fa-user-circle"></i> Profile</a>
                <a href="javascript:void(0)" onclick="logout()" class="nav-logout"><i class="fas fa-sign-out-alt"></i></a>
            `;
            document.getElementById('watchlistLink').style.display = 'inline-block';
            document.getElementById('profName').textContent = user.name;
            document.getElementById('profEmail').textContent = user.email;
            loadMyReviews();
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        async function loadMyReviews() {
            const reviews = await apiGetUserReviews(user.id);
            const container = document.getElementById('myReviewsGrid');
            
            if (reviews.error || reviews.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">You haven\'t reviewed any movies yet.</p>';
                return;
            }

            container.innerHTML = '<div style="margin:20px auto; border:4px solid rgba(255,255,255,0.1); border-top:4px solid var(--primary-color); border-radius:50%; width:30px; height:30px; animation:spin 1s linear infinite;"></div>';
            
            // Map the reviews to the actual movie details concurrently via the Live API
            for(let r of reviews) {
                const mov = await apiGetMovie(r.movie_id);
                r.movie_title = (mov && !mov.error && !mov.message) ? mov.title : 'Unknown Title';
            }

            container.innerHTML = reviews.map(r => {
                let starsHtml = '';
                for(let i=1; i<=10; i++) {
                    starsHtml += i <= r.rating ? '<i class="fas fa-star" style="color:#fbc02d; font-size:12px;"></i>' : '<i class="far fa-star" style="color:#555; font-size:12px;"></i>';
                }
                return `
                    <div class="review-item" style="border-bottom: 1px solid rgba(255,255,255,0.1); padding: 20px 0;">
                        <div class="review-header" style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
                            <div>
                                <h4 style="margin:0;"><a href="movie-details.html?id=${r.movie_id}" style="color:var(--text-main);">${r.movie_title}</a></h4>
                                <div style="margin-top:5px;">${starsHtml}</div>
                            </div>
                            <span class="review-date" style="color:#888; font-size:12px;">${new Date(r.created_at).toLocaleDateString()}</span>
                        </div>
                        <p class="review-text" style="color:#ccc; line-height:1.5;">${r.comment}</p>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
