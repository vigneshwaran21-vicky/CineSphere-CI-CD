<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSphere | Modern Movie Info</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar glass-card">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <span class="logo-accent">Cine</span>Sphere
            </a>
            <div class="search-bar">
                <div class="search-input-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="movieSearch" placeholder="Search Movies...">
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="#movies">Movies</a></li>
                <li id="watchlistLink" style="display:none;"><a href="watchlist.html">Watchlist</a></li>
                <li id="authLink"><a href="login.html">Login</a></li>
            </ul>
        </div>
    </nav>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if(user) {
                document.getElementById('authLink').innerHTML = `
                <a href="profile.html"><i class="fas fa-user-circle"></i> Profile</a>
                <a href="javascript:void(0)" onclick="logout()" class="nav-logout"><i class="fas fa-sign-out-alt"></i></a>
            `;
                document.getElementById('watchlistLink').style.display = 'inline-block';
            }
        });
        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }
    </script>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <h1 class="hero-title">Discover the Best of <span class="text-primary">Cinema</span></h1>
            <p class="hero-subtitle">Your ultimate destination for movie trailers, reviews, and detailed cast information.</p>
            <div class="hero-actions">
                <button class="btn btn-primary"><i class="fas fa-play"></i> Watch Featured</button>
                <button class="btn glass-card"><i class="fas fa-info-circle"></i> View Details</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Trending Section -->
        <section id="movies" class="section">
            <h2 class="section-title">Trending Now</h2>
            <div class="movie-grid" id="featuredMovies">
                <!-- Movie cards will be injected here by app.js -->
            </div>
        </section>

        <!-- Top Rated Section -->
        <section id="top-rated" class="section">
            <h2 class="section-title">Top Rated</h2>
            <div class="movie-grid" id="topRatedMovies">
                <!-- Top rated cards injected here -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-logo">
                <span class="logo-accent">Cine</span>Sphere
            </div>
            <p>&copy; 2026 CineSphere Movie Database. Agile-ALM Demonstration Project.</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-github"></i></a>
                <a href="#"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/api.js?v=2"></script>
    <script src="assets/js/movies.js?v=2"></script>
    <script src="assets/js/state.js?v=2"></script>
    <script src="assets/js/ui.js?v=2"></script>
    <script src="assets/js/app.js?v=2"></script>
</body>
</html>
