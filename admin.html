<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSphere Admin | Movie Management</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body class="admin-body">
    <!-- Admin Navigation -->
    <nav class="navbar glass-card">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <span class="logo-accent">Admin</span>Sphere
            </a>
            <ul class="nav-links">
                <li><a href="index.html">View Site</a></li>
                <li><a href="admin.html" class="active">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <main class="container admin-main">
        <header class="admin-header">
            <div>
                <h1 class="page-title">Movie Management</h1>
                <p class="text-muted">Manage your movie database, reviews, and ratings.</p>
            </div>
            <button class="btn btn-primary" onclick="admin.openModal()">
                <i class="fas fa-plus"></i> Add New Movie
            </button>
        </header>

        <!-- Stats Section -->
        <div class="admin-stats">
            <div class="stat-card glass-card">
                <i class="fas fa-film stat-icon"></i>
                <div class="stat-info">
                    <span class="stat-value" id="totalMoviesCount">0</span>
                    <span class="stat-label">Total Movies</span>
                </div>
            </div>
            <div class="stat-card glass-card">
                <i class="fas fa-star stat-icon"></i>
                <div class="stat-info">
                    <span class="stat-value" id="totalReviewsCount">0</span>
                    <span class="stat-label">Total Reviews</span>
                </div>
            </div>
        </div>

        <!-- Movie Table -->
        <div class="table-container glass-card">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Movie</th>
                        <th>Year</th>
                        <th>Rating</th>
                        <th>Genre</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminMovieTableBody">
                    <!-- Movies injected here -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div id="movieModal" class="modal">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h2 id="modalTitle">Add Movie</h2>
                <button class="close-btn" onclick="admin.closeModal()">&times;</button>
            </div>
            <form id="movieForm" class="admin-form">
                <input type="hidden" id="movieId">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="mTitle" required placeholder="e.g. Inception">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Year</label>
                        <input type="number" id="mYear" required placeholder="2024">
                    </div>
                    <div class="form-group">
                        <label>Rating</label>
                        <input type="number" step="0.1" max="10" id="mRating" required placeholder="8.5">
                    </div>
                </div>
                <div class="form-group">
                    <label>Genre (comma separated)</label>
                    <input type="text" id="mGenre" required placeholder="Sci-Fi, Action, Drama">
                </div>
                <div class="form-group">
                    <label>Poster URL</label>
                    <input type="url" id="mPoster" required placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="mDescription" rows="4" required placeholder="Movie storyline..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" onclick="admin.closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Movie</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/movies.js"></script>
    <script src="assets/js/state.js"></script>
    <script src="assets/js/admin.js"></script>
</body>

</html>
