<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSphere | Set New Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
        .auth-container { max-width: 400px; margin: 100px auto; text-align: center; }
        .auth-form { padding: 30px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        .auth-input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; }
        .auth-btn { width: 100%; padding: 12px; }
        .error-msg { color: #ff4d4d; margin-bottom: 15px; display: none; }
        .success-msg { color: #4CAF50; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>
    <nav class="navbar glass-card">
        <div class="container nav-content">
            <a href="index.html" class="logo"><span class="logo-accent">Cine</span>Sphere</a>
        </div>
    </nav>
    <div class="container auth-container">
        <div class="auth-form glass-card">
            <h2>Set New Password</h2>
            <br>
            <p style="font-size:14px; color:#ccc; margin-bottom:20px;">Enter your new password below to reset your account access.</p>
            <form id="resetForm">
                <input type="password" id="newPassword" class="auth-input" placeholder="New Password" required minlength="6">
                <input type="password" id="confirmPassword" class="auth-input" placeholder="Confirm New Password" required minlength="6">
                <button type="submit" class="btn btn-primary auth-btn" id="submitBtn">Save Password</button>
            </form>
        </div>
    </div>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const btn = document.getElementById('submitBtn');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if(!token) {
                UI.showToast("Invalid or missing token!", "error");
                return;
            }

            if(newPassword !== confirmPassword) {
                UI.showToast("Passwords do not match!", "error");
                return;
            }

            btn.innerHTML = 'Saving...';
            btn.disabled = true;

            const res = await apiResetPasswordWithToken(token, newPassword);
            
            if(res.error) {
                UI.showToast(res.message, 'error');
                btn.innerHTML = 'Save Password';
                btn.disabled = false;
            } else {
                UI.showToast('Password updated successfully! You can now login.', 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            }
        });
    </script>
</body>
</html>
